<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
    <div class="w-full mt-4">   
        <h3 class="flex justify-center text-2xl font-bold">Movies</h3>
        <div class="bg-blue-200">
            <table class="mx-auto mt-2 border">
                <thead>
                    <tr class="border bg-blue-300">
                        <th class="p-8 border">Movie ID</th>
                        <th class="p-8 border">Movie Name</th>
                        <th class="p-8 border">Director</th>
                        <th class="p-8 border">Release Year</th>
                        <th class="p-8 border">Rating</th>
                        <th class="p-8 border">Image</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!-- to be inserted by js -->
                </tbody>
            </table>
        </div>
        
    </div>

  <script>
        const tbody = document.getElementById('tbody');
        async function getData() {
            console.log("Loading data...")
            const response = await fetch('http://localhost:4000/movies');
            const data = await response.json();

            if(data.status == 'success') {
                console.log(data.data);
                for(movie of data.data) {
                    const row = `
                    <tr>
                        <td class="p-2 border">${movie.movie_name}</td>
                        <td class="p-2 border">${movie.movie_id}</td>
                        <td class="p-2 border">${movie.director}</td>
                        <td class="p-2 border">${movie.release_year}</td>
                        <td class="p-2 border">${movie.rating}</td>
                        <td class="p-2 border h-[50px] w-[50px]"><img src="http://localhost:4000/movieImages/${movie.image}" height="200" alt="dangal" /></td>
                    </tr>
                    `
                    tbody.innerHTML += row
                }
            }
        }

        getData()
  </script>
</body>
</html>
